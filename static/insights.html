<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bboo | Insights</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="user" data-page="insights">
    <div class="page-shell">
      <header class="dashboard-topbar glass">
        <div class="brand-row compact-brand">
          <img src="/icon.svg" alt="Bboo icon" class="brand-icon small" />
          <div><p class="eyebrow">Bboo insights</p><h2 id="topbarName">Bboo</h2></div>
        </div>
        <div class="topbar-actions">
          <button id="logoutAllDevices" class="ghost-btn" type="button">Log out other devices</button>
          <button id="backToAuth" class="ghost-btn" type="button">Switch account</button>
        </div>
      </header>
      <div class="dashboard-layout">
        <aside class="glass sidebar-nav">
          <p class="sidebar-title">Pages</p>
          <a href="/dashboard.html" class="sidebar-link">Dashboard</a>
          <a href="/usage.html" class="sidebar-link">App usage</a>
          <a href="/profile.html" class="sidebar-link">Profile</a>
          <a href="/summary.html" class="sidebar-link">Weekly summary</a>
          <a href="/checkins.html" class="sidebar-link">Check-ins</a>
          <a href="/plan.html" class="sidebar-link">Plan</a>
          <a href="/insights.html" class="sidebar-link is-current">Insights</a>
        </aside>
        <main class="dashboard">
          <section class="two-column">
            <article class="glass section-card">
              <div class="section-head"><h3>Actionable insights</h3><p>Recommendations backed by behavioral signals.</p></div>
              <div id="insights" class="stack"></div>
            </article>
            <article id="guardianSection" class="glass section-card">
              <div class="section-head"><h3>Guardian guidance</h3><p>Supportive parent-child linking and summary cards without harsh surveillance.</p></div>
              <p id="guardianMessage" class="panel-message" aria-live="polite"></p>
              <form id="guardianForm" class="control-grid single-column">
                <label><span>Child account email</span><input id="childEmail" type="email" placeholder="child@example.com" /></label>
              </form>
              <button id="linkChild" class="ghost-btn save-panel-btn" type="button">Link child account</button>
              <div id="parentGuidance" class="stack empty-state">Parent mode content appears here.</div>
            </article>
          </section>
          <article class="glass section-card"><div id="sessionMessage" class="panel-message"></div></article>
        </main>
      </div>
    </div>
    <script src="/dashboard.js?v=4"></script>
  </body>
</html>
